{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mobitrace-frontend.fullname" . }}
  labels:
    {{- include "mobitrace-frontend.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "mobitrace-frontend.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
---
{{- if eq .Values.environment "prod" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mobitrace-frontend.fullname" . }}-www-redirect
  labels:
    {{- include "mobitrace-frontend.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      return 308 https://{{ .Values.ingress.host }}$request_uri;
  {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: www.{{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "mobitrace-frontend.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
{{- end }}
{{- end }}