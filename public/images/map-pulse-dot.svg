<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="animatedGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="hsl(155, 100%, 32%)" />
      <stop offset="100%" stop-color="hsl(155, 100%, 32%)" stop-opacity=".5" />
    </radialGradient>
    <radialGradient id="staticGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="60%" stop-color="hsl(155, 100%, 42%)" />
      <stop offset="100%" stop-color="hsl(155, 100%, 32%)" stop-opacity="0.5" />
    </radialGradient>
  </defs>
  <g id="Pulse Dot">
    <circle cx="40" cy="40" r="9" fill="url(#animatedGradient)" fill-opacity="0.3">
      <animate attributeName="r" from="9" to="35" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" from="0.3" to="0" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="40" cy="40" r="9" fill="url(#animatedGradient)">
      <animate attributeName="r" from="9" to="35" dur="3s" begin="0.75s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" from="0.3" to="0" dur="3s" begin="0.75s" repeatCount="indefinite" />
    </circle>
    <circle cx="40" cy="40" r="9" fill="url(#staticGradient)" />
  </g>
</svg>
